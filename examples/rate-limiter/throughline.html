 *
 * Custom properties (--course-*) are the reuse contract: future lessons link
 * this file and build on these tokens plus the base/utility classes below.
 * Vanilla CSS only. No external resources. Mobile-first, 320px and up. */

:root {
  color-scheme: light;

  /* Typography */
  --course-font-body:
    Georgia, "Iowan Old Style", "Source Serif Pro", "Times New Roman", serif;
  --course-font-ui:
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, sans-serif;
  --course-font-mono:
    ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  /* Measure and spacing */
  --course-measure: 70ch;
  --course-space-xs: 0.25rem;
  --course-space-sm: 0.5rem;
  --course-space-md: 1rem;
  --course-space-lg: 1.75rem;
  --course-space-xl: 2.75rem;
  --course-space-xxl: 4rem;
  --course-radius: 3px;

  /* Light theme (default): plain page, ink text */
  --course-color-bg: #ffffff;
  --course-color-surface: #f4f4f2;
  --course-color-text: #1a1a1a;
  --course-color-muted: #4d4d4d;
  --course-color-border: #cfcfc9;
  --course-color-rule: #1a1a1a;
  --course-color-accent: #0f4c5c;
  --course-color-accent-contrast: #ffffff;
  --course-color-accent-soft-bg: #e9f0f2;
  --course-color-focus: #8a3b00;
  --course-color-success: #2d6a4f;
  --course-color-notice-bg: #f4f4f2;
  --course-color-shadow: rgba(26, 26, 26, 0.12);
}

/* ---------- Base ---------- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--course-color-bg);
  color: var(--course-color-text);
  font-family: var(--course-font-body);
  font-size: 1.0625rem;
  line-height: 1.65;
}

h1,
h2,
h3,
h4 {
  line-height: 1.25;
  text-wrap: balance;
}

h1 {
  font-size: clamp(1.8rem, 1.2rem + 3vw, 2.7rem);
  letter-spacing: -0.01em;
  margin: 0 0 var(--course-space-sm);
}

h2 {
  font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.65rem);
  margin: var(--course-space-xxl) 0 var(--course-space-md);
  padding-top: var(--course-space-md);
  border-top: 3px double var(--course-color-rule);
}

h3 {
  font-size: 1.2rem;
  margin: var(--course-space-xl) 0 var(--course-space-sm);
}

h4 {
  font-size: 1.05rem;
  margin: 0;
}

p {
  margin: 0 0 var(--course-space-md);
}

a {
  color: var(--course-color-accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.15em;
}

a:hover {
  text-decoration-thickness: 2px;
}

ul,
ol {
  margin: 0 0 var(--course-space-md);
  padding-left: 1.4em;
}

li {
  margin-bottom: var(--course-space-sm);
}

li::marker {
  color: var(--course-color-muted);
}

code,
kbd {
  font-family: var(--course-font-mono);
  font-size: 0.9em;
}

/* Visible focus everywhere, including summary and form controls. */
:focus-visible {
  outline: 3px solid var(--course-color-focus);
  outline-offset: 2px;
  border-radius: var(--course-radius);
}

/* ---------- Layout ---------- */

.container {
  max-width: var(--course-measure);
  margin-inline: auto;
  padding-inline: 1rem;
}

@media (min-width: 48rem) {
  .container {
    padding-inline: 1.5rem;
  }
}

.skip-link {
  position: absolute;
  left: 0.5rem;
  top: -4rem;
  z-index: 100;
  background: var(--course-color-surface);
  color: var(--course-color-text);
  border: 2px solid var(--course-color-focus);
  border-radius: var(--course-radius);
  padding: var(--course-space-sm) var(--course-space-md);
  font-family: var(--course-font-ui);
  font-size: 0.95rem;
  transition: top 0.15s ease;
}

.skip-link:focus {
  top: 0.5rem;
}

/* ---------- Header ---------- */

.site-header {
  border-top: 6px solid var(--course-color-rule);
  padding-top: var(--course-space-lg);
  padding-bottom: var(--course-space-md);
}

.site-header .kicker {
  font-family: var(--course-font-ui);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--course-color-muted);
  margin: 0 0 var(--course-space-sm);
}

.site-header .lede {
  font-size: 1.15rem;
  max-width: 60ch;
}

.program-facts {
  list-style: none;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--course-space-sm) var(--course-space-lg);
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  color: var(--course-color-muted);
  border-top: 1px solid var(--course-color-border);
  border-bottom: 1px solid var(--course-color-border);
  padding-block: var(--course-space-sm);
}

.program-facts li {
  margin: 0;
}

.program-facts strong {
  color: var(--course-color-text);
  font-weight: 700;
}

/* ---------- Notices, badges, utilities ---------- */

.notice {
  background: var(--course-color-notice-bg);
  border: 1px solid var(--course-color-muted);
  border-radius: var(--course-radius);
  padding: var(--course-space-md) var(--course-space-md) 0.25rem;
  margin: 0 0 var(--course-space-lg);
}

.notice-title {
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  font-weight: 700;
  margin: 0 0 var(--course-space-sm);
}

.notice p:last-child {
  margin-bottom: var(--course-space-md);
}

.badge {
  display: inline-block;
  font-family: var(--course-font-ui);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--course-color-accent);
  color: var(--course-color-accent-contrast);
  border-radius: 999px;
  padding: 0.15em 0.7em;
  vertical-align: middle;
  white-space: nowrap;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Progressive enhancement: JS-only controls stay hidden without JS. */
.js-only {
  display: none;
}

html.js .js-only {
  display: revert;
}

html.js .no-js-note {
  display: none;
}

/* ---------- Phase jump nav ---------- */

.phase-nav {
  margin: var(--course-space-lg) 0 0;
}

.phase-nav p {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
  color: var(--course-color-muted);
  margin-bottom: var(--course-space-sm);
}

.phase-nav ul {
  list-style: none;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--course-space-sm);
}

.phase-nav li {
  margin: 0;
}

.phase-nav a {
  display: inline-block;
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  border: 1px solid var(--course-color-border);
  border-radius: 999px;
  padding: 0.3em 0.9em;
  text-decoration: none;
  background: var(--course-color-surface);
}

.phase-nav a:hover {
  border-color: var(--course-color-accent);
  text-decoration: underline;
}

/* ---------- Progress and toolbar ---------- */

.progress {
  background: var(--course-color-surface);
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  padding: var(--course-space-md);
  margin: var(--course-space-lg) 0;
}

.progress p {
  margin-bottom: var(--course-space-sm);
}

.progress .count {
  font-family: var(--course-font-ui);
  font-weight: 700;
}

.progress progress {
  width: 100%;
  height: 0.6rem;
  accent-color: var(--course-color-accent);
}

.progress .disclaimer {
  font-size: 0.92rem;
  color: var(--course-color-muted);
  margin-bottom: 0;
}

.toolbar {
  background: var(--course-color-bg);
  border-block: 1px solid var(--course-color-border);
  padding-block: var(--course-space-sm);
  margin-bottom: var(--course-space-lg);
}

@supports (position: sticky) {
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 0 var(--course-color-shadow);
  }
}

.toolbar-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--course-space-sm);
  margin-bottom: var(--course-space-sm);
}

.toolbar-group:last-child {
  margin-bottom: 0;
}

.toolbar-label {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--course-color-muted);
  margin-right: var(--course-space-xs);
}

.button {
  font-family: var(--course-font-ui);
  font-size: 0.88rem;
  line-height: 1.3;
  background: var(--course-color-surface);
  color: var(--course-color-text);
  border: 1px solid var(--course-color-border);
  border-radius: 999px;
  padding: 0.4em 0.95em;
  cursor: pointer;
}

.button:hover {
  border-color: var(--course-color-accent);
}

.button[aria-pressed="true"] {
  background: var(--course-color-accent);
  border-color: var(--course-color-accent);
  color: var(--course-color-accent-contrast);
  font-weight: 700;
}

.showing {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
  color: var(--course-color-muted);
}

/* ---------- Phases and chapters ---------- */

.phase {
  margin-bottom: var(--course-space-xl);
  scroll-margin-top: 6rem;
}

.phase-head p {
  color: var(--course-color-muted);
  font-size: 0.98rem;
}

.chapter-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.chapter {
  border-top: 1px solid var(--course-color-border);
  padding: var(--course-space-md) 0;
  scroll-margin-top: 6rem;
}

.chapter-list > li:last-child .chapter {
  border-bottom: 1px solid var(--course-color-border);
}

.chapter.is-done .chapter-done {
  border-color: var(--course-color-success);
  color: var(--course-color-success);
  font-weight: 700;
}

.chapter.is-done .chapter-done::after {
  content: "\\2713";
  font-weight: 700;
}

.chapter-top {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--course-space-sm);
}

.chapter-kicker {
  display: block;
  font-family: var(--course-font-ui);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--course-color-muted);
  margin-bottom: 0.15em;
}

.chapter-done {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--course-space-sm);
  font-family: var(--course-font-ui);
  font-size: 0.88rem;
  color: var(--course-color-muted);
  cursor: pointer;
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  background: var(--course-color-surface);
  padding: 0.25em 0.6em;
}

.chapter-done:hover {
  border-color: var(--course-color-accent);
}

.chapter-done input {
  width: 1.1rem;
  height: 1.1rem;
  margin: 0;
  accent-color: var(--course-color-accent);
  cursor: pointer;
}

.scope {
  margin: var(--course-space-sm) 0;
  max-width: 62ch;
}

.field {
  font-variant: small-caps;
  letter-spacing: 0.04em;
}

/* Native disclosure: keyboard + AT support with zero JS. */
.more {
  margin-top: var(--course-space-sm);
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  background: var(--course-color-surface);
}

.more summary {
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  font-weight: 700;
  padding: var(--course-space-sm) var(--course-space-md);
  cursor: pointer;
}

.more summary::marker {
  color: var(--course-color-accent);
}

.more summary:hover {
  text-decoration: underline;
}

.facts {
  margin: 0;
  padding: 0 var(--course-space-md) var(--course-space-md);
  border-top: 1px solid var(--course-color-border);
}

.facts dt {
  font-family: var(--course-font-ui);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--course-color-muted);
  margin-top: var(--course-space-md);
}

.facts dd {
  margin: var(--course-space-xs) 0 0;
}

.facts dd ul {
  margin-bottom: 0;
}

.facts a {
  font-family: var(--course-font-ui);
  font-size: 0.92rem;
}

/* ---------- Readiness, capstones, gates ---------- */

.layer-list,
.capstone-list {
  list-style: none;
  padding: 0;
}

.layer,
.capstone {
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  background: var(--course-color-surface);
  padding: var(--course-space-md);
  margin-bottom: var(--course-space-md);
}

.layer h3,
.capstone h3 {
  margin-top: 0;
}

.layer .span,
.capstone .span {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
  color: var(--course-color-muted);
  margin-bottom: var(--course-space-sm);
}

.gates {
  counter-reset: gate;
}

.capstone-bar {
  font-size: 0.98rem;
}

/* ---------- Footer ---------- */

.site-footer {
  border-top: 3px double var(--course-color-rule);
  margin-top: var(--course-space-xxl);
  padding: var(--course-space-lg) 0 var(--course-space-xxl);
  font-size: 0.92rem;
  color: var(--course-color-muted);
}

/* ---------- Reduced motion ---------- */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }

  html {
    scroll-behavior: auto;
  }
}

/* ---------- Print ---------- */

@media print {
  :root {
    --course-color-bg: #ffffff;
    --course-color-surface: #ffffff;
    --course-color-text: #000000;
    --course-color-muted: #333333;
    --course-color-border: #999999;
    --course-color-rule: #000000;
    --course-color-accent: #000000;
    --course-color-notice-bg: #ffffff;
  }

  body {
    font-size: 11pt;
    line-height: 1.5;
  }

  .skip-link,
  .toolbar,
  .phase-nav,
  .chapter-done,
  .more summary,
  .site-footer .no-print {
    display: none !important;
  }

  .more {
    border: none;
    background: none;
  }

  .facts {
    border-top: none;
    padding: 0;
  }

  .chapter,
  .layer,
  .capstone,
  .notice {
    break-inside: avoid;
  }

  a {
    color: inherit;
  }

  a[href^="http"]::after {
    content: " <" attr(href) ">";
    font-size: 0.8em;
    word-break: break-all;
  }

  .progress progress {
    display: none;
  }
}

/* ---------- Lessons and quizzes (reusable) ----------
 *
 * Generic lesson layer for any lesson page linking course.css.
 * All selectors below are reusable across lessons; no per-lesson ids. */

.crumb {
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  margin-top: var(--course-space-lg);
}

/* One-sentence model or other key claim worth remembering. */
.key-model {
  font-size: 1.15rem;
  background: var(--course-color-surface);
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  padding: var(--course-space-md);
}

/* Standalone definition list (outside <details>). */
.vocab {
  margin: 0 0 var(--course-space-lg);
}

.vocab dt {
  font-family: var(--course-font-ui);
  font-weight: 700;
  margin-top: var(--course-space-md);
}

.vocab dd {
  margin: var(--course-space-xs) 0 0;
}

/* Ordered conceptual path (e.g. the eight-step bid path). */
.path-steps li {
  margin-bottom: var(--course-space-sm);
}

/* Responsive data table. */
.table-scroll {
  overflow-x: auto;
  margin-bottom: var(--course-space-lg);
}

.data-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.98rem;
}

.data-table th,
.data-table td {
  border: 1px solid var(--course-color-border);
  padding: var(--course-space-sm) var(--course-space-md);
  text-align: left;
  vertical-align: top;
}

.data-table thead th {
  background: var(--course-color-surface);
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
}

/* Sequence quiz: one row per shuffled item. */
.quiz {
  list-style: none;
  padding: 0;
  margin: 0 0 var(--course-space-lg);
}

.quiz-row {
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  background: var(--course-color-surface);
  padding: var(--course-space-md);
  margin-bottom: var(--course-space-md);
}

.quiz-desc {
  margin-top: 0;
}

.quiz-label {
  display: block;
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  font-weight: 700;
  margin: var(--course-space-sm) 0 var(--course-space-xs);
}

.quiz-select {
  font-family: var(--course-font-ui);
  font-size: 1rem;
  padding: 0.3em 0.5em;
  min-width: 4.5rem;
  background: var(--course-color-bg);
  color: var(--course-color-text);
  border: 1px solid var(--course-color-muted);
  border-radius: var(--course-radius);
}

.row-feedback {
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  margin: var(--course-space-sm) 0 0;
  min-height: 1.4em;
}

.row-feedback.is-correct {
  color: var(--course-color-success);
  font-weight: 700;
}

.row-feedback.is-wrong {
  font-weight: 700;
}

.quiz-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--course-space-sm);
  margin-bottom: var(--course-space-md);
}

.score {
  font-family: var(--course-font-ui);
  font-weight: 700;
}

.score:empty {
  display: none;
}

.review-hints {
  font-size: 0.98rem;
}

.review-hints ul {
  margin-bottom: 0;
}

@media print {
  .quiz-actions,
  .no-js-note {
    display: none !important;
  }

  .table-scroll {
    overflow: visible;
  }

  .quiz-row,
  .key-model,
  figure,
  .data-table tr {
    break-inside: avoid;
  }
}

/* Multiple-choice snapshot exercise (radio groups; reusable).
 * Structure: li.quiz-row > fieldset.quiz-fieldset[data-correct] > legend +
 * ul.evidence + ul.choices. No per-lesson selectors. */

.quiz-fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}

.quiz-fieldset legend {
  font-weight: 700;
  padding: 0;
  margin-bottom: var(--course-space-sm);
}

.evidence {
  list-style: none;
  padding: 0;
  margin: 0 0 var(--course-space-md);
  font-size: 0.98rem;
}

.evidence li {
  margin-bottom: var(--course-space-xs);
}

.evidence strong {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
}

.choices {
  list-style: none;
  padding: 0;
  margin: 0;
}

.choices li {
  margin-bottom: var(--course-space-sm);
}

.choices li:last-child {
  margin-bottom: 0;
}

.choice {
  display: flex;
  gap: var(--course-space-sm);
  align-items: flex-start;
  cursor: pointer;
}

.choice input {
  width: 1.15rem;
  height: 1.15rem;
  margin-top: 0.2em;
  flex-shrink: 0;
  accent-color: var(--course-color-accent);
  cursor: pointer;
}

.choice span {
  display: block;
}

/* Simple box-and-arrow flow visual (reusable).
 * Structure: ol.flow > li.flow-step. Arrows between steps are CSS-generated,
 * so assistive tech hears only the ordered steps. Wraps on narrow screens. */

.flow {
  list-style: none;
  padding: 0;
  margin: 0 0 var(--course-space-md);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  row-gap: var(--course-space-md);
}

.flow-step {
  position: relative;
  background: var(--course-color-surface);
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  padding: var(--course-space-sm) var(--course-space-md);
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  font-weight: 700;
}

.flow-step + .flow-step {
  margin-left: 2.25rem;
}

.flow-step + .flow-step::before {
  content: "\\2192";
  position: absolute;
  left: -1.75rem;
  top: 50%;
  width: 1.25rem;
  text-align: center;
  transform: translateY(-50%);
  color: var(--course-color-muted);
  font-weight: 400;
}

/* Raw HTTP message blocks and line annotations (reusable).
 * Structure: figure > pre.http-message > code holds the exact message text;
 * ol.http-annotations holds per-line notes. Line numbers live in the notes,
 * never inside the <pre>, so the message bytes stay exact. */

.http-message {
  font-family: var(--course-font-mono);
  font-size: 0.88rem;
  line-height: 1.6;
  background: var(--course-color-surface);
  color: var(--course-color-text);
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  padding: var(--course-space-md);
  margin: 0 0 var(--course-space-md);
  overflow-x: auto;
  white-space: pre;
  tab-size: 2;
  max-width: 100%;
}

.http-message code {
  font: inherit;
  color: inherit;
  background: none;
  padding: 0;
}

.http-annotations {
  margin: 0 0 var(--course-space-lg);
  font-size: 0.98rem;
}

.http-annotations strong {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
}

@media print {
  .http-message {
    white-space: pre-wrap;
    word-break: break-word;
    background: none;
  }

  .http-message,
  .http-annotations {
    break-inside: avoid;
  }
}

/* ---------- Constraint and verdict visuals (reusable) ----------
 *
 * First-class table cues for guarded tables: column badges naming the
 * constraint on each column, row states for rejected and newly stored
 * rows, verdict boxes for accept/reject outcomes, and cards for the
 * insert simulator. All selectors below are reusable across lessons;
 * no per-lesson ids. */

:root {
  --course-color-danger: #9d0208;
  --course-color-danger-soft-bg: #fbe9e7;
  --course-color-success-soft-bg: #e6f2ea;
}

/* Column constraint badges, stacked under the column name in thead. */
.data-table .col-name {
  display: block;
  font-size: 0.95rem;
}

.col-badge {
  display: inline-block;
  font-family: var(--course-font-ui);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
  vertical-align: middle;
  color: var(--course-color-text);
  background: transparent;
  border: 1px solid var(--course-color-muted);
  border-radius: 999px;
  padding: 0.1em 0.6em;
  margin: 0.3em 0.3em 0 0;
}

.col-badge.is-pk {
  background: var(--course-color-accent);
  border-color: var(--course-color-accent);
  color: var(--course-color-accent-contrast);
}

.col-badge.is-fk {
  border-color: var(--course-color-accent);
  color: var(--course-color-accent);
}

/* Row and cell states for verdict visuals. */
.data-table tbody tr.row-invalid {
  background: var(--course-color-danger-soft-bg);
}

.data-table tbody tr.row-invalid > *:first-child {
  border-left: 4px solid var(--course-color-danger);
}

.data-table tbody tr.row-new {
  background: var(--course-color-success-soft-bg);
}

.data-table tbody tr.row-new > *:first-child {
  border-left: 4px solid var(--course-color-success);
}

.data-table td.cell-missing {
  color: var(--course-color-muted);
  font-style: italic;
}

.data-table td.cell-bad {
  color: var(--course-color-danger);
  font-weight: 700;
}

/* Right-aligned numeric columns. */
.data-table th.num,
.data-table td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Accept/reject verdict box. Hidden while empty (before first try). */
.verdict {
  border: 1px solid var(--course-color-border);
  border-left-width: 5px;
  border-radius: var(--course-radius);
  background: var(--course-color-surface);
  padding: var(--course-space-sm) var(--course-space-md);
  font-family: var(--course-font-ui);
  font-size: 0.92rem;
}

.verdict:empty {
  display: none;
}

.verdict.is-accept {
  border-left-color: var(--course-color-success);
}

.verdict.is-reject {
  border-left-color: var(--course-color-danger);
}

/* Insert simulator: one card per candidate row.
 * Structure: ol.sim-list > li.sim-candidate > h3 + values table +
 * fieldset.sim-predict + try button + p.verdict. */

.sim-list {
  list-style: none;
  padding: 0;
}

.sim-candidate {
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  background: var(--course-color-surface);
  padding: var(--course-space-md);
  margin-bottom: var(--course-space-md);
}

.sim-candidate h3 {
  margin-top: 0;
  font-size: 1.05rem;
}

.sim-candidate .table-scroll {
  margin-bottom: var(--course-space-md);
}

.sim-predict {
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  padding: var(--course-space-sm) var(--course-space-md);
  margin: 0 0 var(--course-space-md);
}

.sim-predict legend {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
  font-weight: 700;
  padding: 0 0.4em;
}

.sim-predict label {
  display: inline-flex;
  align-items: center;
  gap: var(--course-space-sm);
  margin: 0 var(--course-space-lg) var(--course-space-xs) 0;
  font-family: var(--course-font-ui);
  font-size: 0.92rem;
  cursor: pointer;
}

.sim-predict input {
  width: 1.15rem;
  height: 1.15rem;
  margin: 0;
  accent-color: var(--course-color-accent);
  cursor: pointer;
}

@media print {
  :root {
    --course-color-danger: #000000;
    --course-color-danger-soft-bg: #ffffff;
    --course-color-success-soft-bg: #ffffff;
  }

  .sim-candidate,
  .verdict {
    break-inside: avoid;
  }
}

/* ---------- Schema diagrams (reusable) ----------
 *
 * Compact entity-relationship figure for schema lessons: boxes for
 * tables, labeled links for cardinality. Static SVG; scales to the
 * measure and inherits the light/print palettes from course
 * tokens. No per-lesson selectors. */

.schema-figure {
  margin: 0 0 var(--course-space-lg);
}

.schema-svg {
  display: block;
  width: 100%;
  height: auto;
  background: var(--course-color-bg);
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
}

.schema-svg text {
  font-family: var(--course-font-ui);
  fill: var(--course-color-text);
}

.schema-box {
  fill: var(--course-color-surface);
  stroke: var(--course-color-muted);
  stroke-width: 1.5;
}

.schema-box.is-junction {
  stroke: var(--course-color-accent);
  stroke-dasharray: 6 3;
}

.schema-title {
  font-size: 13px;
  font-weight: 700;
}

.schema-col {
  font-family: var(--course-font-mono);
  font-size: 12px;
}

.schema-link {
  stroke: var(--course-color-muted);
  stroke-width: 1.5;
}

.schema-link.is-optional {
  stroke-dasharray: 5 4;
}

.schema-label {
  font-size: 11px;
  fill: var(--course-color-muted);
}

.schema-caption {
  font-size: 0.95rem;
  color: var(--course-color-muted);
  margin-top: var(--course-space-sm);
}

@media print {
  .schema-figure {
    break-inside: avoid;
  }
}

/* ---------- Strong teaching tables + breakout visuals (Lesson 0012+) ----------
 * Learner feedback: tables must look like tables (grid + header hierarchy),
 * dense visuals must break out wider than the 70ch prose column, and diagram
 * and table regions must read as separate artifacts. Reusable: no per-lesson
 * ids. Tables never become cards; narrow screens scroll horizontally. */

:root {
  --course-color-table-outer: #1a1a1a;
  --course-color-table-grid: #6f6f6a;
  --course-color-table-header-bg: #0f4c5c;
  --course-color-table-header-text: #ffffff;
  --course-color-table-zebra: #efede8;
  --course-color-table-rowhead-bg: #e9f0f2;
}

/* Framed artifact: diagram and table regions read as separate objects. */
.artifact {
  border: 2px solid var(--course-color-table-outer);
  border-radius: var(--course-radius);
  background: var(--course-color-bg);
  padding: var(--course-space-md);
  margin: 0 0 var(--course-space-lg);
}

.artifact-label {
  font-family: var(--course-font-ui);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--course-color-muted);
  margin: 0 0 var(--course-space-sm);
}

.artifact .table-scroll,
.artifact .schema-figure {
  margin-bottom: 0;
}

/* Breakout: dense visuals go wider than the 70ch column on desktop. */
.breakout {
  width: 100%;
  max-width: 100%;
}

@media (min-width: 48rem) {
  .breakout {
    width: min(64rem, calc(100vw - 3rem));
    margin-inline: calc((100% - min(64rem, calc(100vw - 3rem))) / 2);
    max-width: none;
  }
}

/* Strong grid tables. Outer 2px border; inner 1px grid stays visible. */
.table-scroll {
  overflow-x: auto;
  margin-bottom: var(--course-space-lg);
  -webkit-overflow-scrolling: touch;
}

.data-table {
  border-collapse: collapse;
  width: 100%;
  min-width: 38rem;
  font-size: 0.98rem;
  border: 2px solid var(--course-color-table-outer);
  background: var(--course-color-bg);
}

.data-table caption {
  caption-side: top;
  text-align: left;
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--course-color-text);
  background: var(--course-color-surface);
  border: 2px solid var(--course-color-table-outer);
  border-bottom: 0;
  padding: var(--course-space-sm) var(--course-space-md);
}

.data-table th,
.data-table td {
  border: 1px solid var(--course-color-table-grid);
  padding: 0.65rem 0.9rem;
  text-align: left;
  vertical-align: top;
}

.data-table thead th {
  background: var(--course-color-table-header-bg);
  color: var(--course-color-table-header-text);
  font-family: var(--course-font-ui);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}

.data-table tbody tr:nth-child(even) {
  background: var(--course-color-table-zebra);
}

.data-table tbody th[scope="row"] {
  font-weight: 700;
  background: var(--course-color-table-rowhead-bg);
  white-space: nowrap;
}

.data-table tbody tr:nth-child(even) th[scope="row"] {
  background: var(--course-color-table-rowhead-bg);
  filter: brightness(0.97);
}

/* Mermaid whiteboard figure: readable at full size, scrolls on narrow panes. */
.schema-figure {
  margin: 0 0 var(--course-space-lg);
}

.mermaid {
  background: var(--course-color-bg);
  border: 1px solid var(--course-color-table-grid);
  border-radius: var(--course-radius);
  padding: var(--course-space-md);
  min-height: 22rem;
  overflow-x: auto;
  font-size: 1rem;
  line-height: 1.4;
}

.mermaid svg {
  width: 56rem !important;
  min-width: 56rem;
  max-width: none !important;
  height: auto;
  font-size: 1rem;
}

.diagram-legend {
  list-style: none;
  padding: 0;
  margin: var(--course-space-sm) 0 0;
  font-family: var(--course-font-ui);
  font-size: 0.88rem;
  color: var(--course-color-muted);
  display: flex;
  flex-wrap: wrap;
  gap: var(--course-space-sm) var(--course-space-lg);
}

.diagram-legend li {
  margin: 0;
}

.mermaid-fallback {
  font-family: var(--course-font-ui);
  font-size: 0.9rem;
  border: 1px dashed var(--course-color-table-grid);
  border-radius: var(--course-radius);
  padding: var(--course-space-sm) var(--course-space-md);
  margin: var(--course-space-sm) 0 0;
}

/* Generic source-code block (reusable; first used Lesson 0013).
 * Structure: figure > pre.code-block > code holds the exact source text.
 * Same tokens as .http-message, without HTTP-specific semantics, so SQL,
 * Go, and other listings share one style. No per-lesson selectors. */
.code-block {
  font-family: var(--course-font-mono);
  font-size: 0.88rem;
  line-height: 1.6;
  background: var(--course-color-surface);
  color: var(--course-color-text);
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  padding: var(--course-space-md);
  margin: 0 0 var(--course-space-md);
  overflow-x: auto;
  white-space: pre;
  tab-size: 2;
  max-width: 100%;
}

.code-block code {
  font: inherit;
  color: inherit;
  background: none;
  padding: 0;
}

@media print {
  :root {
    --course-color-table-outer: #000000;
    --course-color-table-grid: #555555;
    --course-color-table-header-bg: #000000;
    --course-color-table-header-text: #ffffff;
    --course-color-table-zebra: #f0f0f0;
    --course-color-table-rowhead-bg: #e8e8e8;
  }

  .breakout {
    width: 100%;
    margin-inline: 0;
  }

  .data-table {
    min-width: 0;
  }

  .mermaid {
    min-height: 0;
  }

  .mermaid svg {
    min-width: 0;
  }

  .code-block {
    white-space: pre-wrap;
    word-break: break-word;
    background: none;
    break-inside: avoid;
  }
}

/* ---------- Build-track lessons (Lesson 0024+) ----------
 * One service grows across a chapter. Reusable, no per-lesson ids:
 * .track (where this lesson sits in the build), .compare (TypeScript beside Go),
 * .task (the learner's small edit), .figure (inline SVG diagram),
 * code-comment and edit-marker spans inside .code-block. */

.track {
  list-style: none;
  padding: 0;
  margin: var(--course-space-md) 0 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--course-space-xs);
  font-family: var(--course-font-ui);
  font-size: 0.78rem;
}

.track li {
  margin: 0;
  padding: 0.2rem 0.55rem;
  border: 1px solid var(--course-color-border);
  border-radius: 999px;
  color: var(--course-color-muted);
  background: var(--course-color-bg);
}

.track li.is-done {
  color: var(--course-color-text);
  background: var(--course-color-surface);
}

.track li[aria-current="step"] {
  color: var(--course-color-accent-contrast);
  background: var(--course-color-accent);
  border-color: var(--course-color-accent);
  font-weight: 700;
}

.compare {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--course-space-md);
  margin-bottom: var(--course-space-lg);
}

@media (min-width: 48rem) {
  .compare {
    grid-template-columns: 1fr 1fr;
  }
}

.compare > div {
  min-width: 0;
}

.compare .code-block {
  margin: 0;
  height: calc(100% - 1.6rem);
}

.compare-label {
  font-family: var(--course-font-ui);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--course-color-muted);
  margin: 0 0 var(--course-space-xs);
}

.code-block .c {
  color: #5f6b62;
  font-style: italic;
}

.code-block mark {
  background: #fff1c2;
  color: inherit;
  padding: 0 0.15em;
  border-radius: 2px;
}

.task {
  border: 2px solid var(--course-color-accent);
  border-left-width: 8px;
  border-radius: var(--course-radius);
  background: var(--course-color-accent-soft-bg);
  padding: var(--course-space-md) var(--course-space-md) var(--course-space-sm);
  margin: 0 0 var(--course-space-lg);
}

.task-title {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--course-color-accent);
  margin: 0 0 var(--course-space-sm);
}

.task .code-block {
  background: var(--course-color-bg);
}

.figure {
  margin-top: 0;
  margin-bottom: var(--course-space-lg);
}

.figure:not(.breakout) {
  margin-inline: 0;
}

@media (max-width: 47.99rem) {
  /* Like tables: keep diagram text legible and scroll sideways inside the figure. */
  .figure {
    margin-inline: 0;
    overflow-x: auto;
  }

  .figure svg {
    min-width: 42rem;
  }
}

/* Long unbroken inline code (JSON lines, URLs) must wrap instead of widening the page. */
p code,
li code {
  overflow-wrap: anywhere;
}

.figure svg {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
}

.figure figcaption {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
  color: var(--course-color-muted);
  margin-top: var(--course-space-sm);
}

.rules {
  padding-left: 1.2rem;
}

.rules li {
  margin-bottom: var(--course-space-sm);
}

@media print {
  .track li[aria-current="step"] {
    background: none;
    color: #000000;
    border: 2px solid #000000;
  }

  .code-block mark {
    background: none;
    text-decoration: underline;
  }
}

/* ---------- Recall cards (Lesson 0031.1+) ----------
 * Flashcards built on native <details>: the front shows code, the learner
 * says the meaning aloud, then opens the card. Works without JavaScript. */

.recall {
  list-style: none;
  padding: 0;
  margin: 0 0 var(--course-space-lg);
  display: grid;
  align-items: start;
  grid-template-columns: 1fr;
  gap: var(--course-space-sm);
}

@media (min-width: 48rem) {
  .recall {
    grid-template-columns: 1fr 1fr;
  }
}

.recall li {
  margin: 0;
}

.recall details {
  border: 1px solid var(--course-color-border);
  border-radius: var(--course-radius);
  background: var(--course-color-surface);
}

.recall summary {
  cursor: pointer;
  padding: var(--course-space-sm) var(--course-space-md);
  font-family: var(--course-font-mono);
  font-size: 0.86rem;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.recall details[open] summary {
  border-bottom: 1px solid var(--course-color-border);
}

.recall .back {
  padding: var(--course-space-sm) var(--course-space-md) var(--course-space-md);
  background: var(--course-color-bg);
  font-size: 0.95rem;
}

.recall .back p {
  margin: 0 0 var(--course-space-xs);
}

.recall .ts {
  font-family: var(--course-font-ui);
  font-size: 0.85rem;
  color: var(--course-color-muted);
}
`,at=`/* Interactive lesson components (2026-10, learner request).
 * Reusable across lessons; lesson-specific drawing lives in assets/lesson-NNNN.js.
 * - .stepnav / .step-panel: a step navigator over one long page. It highlights the
 *   step being read and scrolls to a step on click (the page reads fine without JS).
 * - .viz: a diagram card with .viz-top controls: .seg (a toggle that flips one
 *   variable) and .play. Diagrams render a complete resting state; Play animates.
 * - .remember: the one-line takeaway that ends a step.
 * - .vs: new language beside TypeScript, same task.
 * Colours derive from the course tokens; the --viz-* tokens are the only additions. */

:root {
  --viz-ok: #2d6a4f;
  --viz-ok-soft: #e3f1e8;
  --viz-bad: #a8322b;
  --viz-bad-soft: #f8e1de;
  --viz-warn: #8a6100;
  --viz-warn-soft: #fbf0d4;
  --viz-run: var(--course-color-accent);
  --viz-run-soft: var(--course-color-accent-soft-bg);
}

/* ---------- Step navigation ----------
 * viz.js builds <nav class="stepnav"> as a direct child of the lesson container.
 * Narrow screens: a sticky top bar (current step, prev/next scroll, tap to open the list).
 * Wide screens: a fixed sidebar left of the reading column, when it fits (viz.js measures). */
.stepnav {
  position: sticky;
  top: 0;
  z-index: 20;
  margin: var(--course-space-lg) 0 0;
  background: var(--course-color-bg);
  border: 1px solid var(--course-color-border);
  border-radius: 10px;
  box-shadow: 0 2px 10px var(--course-color-shadow);
  font-family: var(--course-font-ui);
}
.stepnav-bar {
  display: flex;
  align-items: stretch;
}
.stepnav-bar button {
  font: 600 0.9rem var(--course-font-ui);
  color: var(--course-color-text);
  background: transparent;
  border: 0;
  padding: 0.65rem 0.8rem;
  cursor: pointer;
}
.stepnav-bar .stepnav-arrow {
  color: var(--course-color-accent);
  font-size: 1.1rem;
}
.stepnav-bar .stepnav-arrow:disabled {
  color: var(--course-color-border);
  cursor: default;
}
.stepnav-current {
  flex: 1;
  text-align: left;
  border-left: 1px solid var(--course-color-border) !important;
  border-right: 1px solid var(--course-color-border) !important;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.stepnav-current .count {
  color: var(--course-color-accent);
  margin-right: 0.35rem;
}
.stepnav-current .caret {
  float: right;
  color: var(--course-color-muted);
}
.stepnav-progress {
  height: 4px;
  background: var(--course-color-surface);
  border-radius: 0 0 10px 10px;
  overflow: hidden;
}
.stepnav-progress span {
  display: block;
  height: 100%;
  background: var(--course-color-accent);
  transition: width 0.25s;
}
.stepnav-head {
  display: none;
  font: 700 0.72rem var(--course-font-ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--course-color-muted);
  margin: 0 0 var(--course-space-sm);
}
.stepnav-list {
  display: none;
  list-style: none;
  margin: 0;
  padding: var(--course-space-sm);
  border-top: 1px solid var(--course-color-border);
}
.stepnav.open .stepnav-list {
  display: block;
}
.stepnav-list li {
  margin: 0;
  position: relative;
}
.stepnav.side .stepnav-list button {
  font-size: 0.88rem;
  padding: 0.4rem 0.35rem;
}
.stepnav-list button {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  width: 100%;
  text-align: left;
  font: 0.92rem/1.3 var(--course-font-ui);
  color: var(--course-color-text);
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 0.45rem 0.5rem;
  cursor: pointer;
}
.stepnav-list button:hover {
  background: var(--course-color-surface);
}
.stepnav-list .num {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 1.6rem;
  height: 1.6rem;
  border-radius: 50%;
  border: 1.5px solid var(--course-color-border);
  background: var(--course-color-bg);
  font: 700 0.78rem var(--course-font-ui);
  color: var(--course-color-muted);
  position: relative;
  z-index: 1;
}
.stepnav-list li.done .num {
  border-color: var(--viz-ok);
  color: var(--viz-ok);
  background: var(--viz-ok-soft);
}
.stepnav-list button[aria-current="step"] {
  background: var(--viz-run-soft);
  font-weight: 700;
}
.stepnav-list button[aria-current="step"] .num {
  background: var(--course-color-accent);
  border-color: var(--course-color-accent);
  color: var(--course-color-accent-contrast);
}
.stepnav-list .opt {
  color: var(--course-color-muted);
  font-weight: 400;
  font-size: 0.8rem;
}

/* Sidebar mode: viz.js adds .side when the space left of the reading column fits it. */
.stepnav.side {
  position: fixed;
  top: 1.5rem;
  left: 1rem;
  width: 12rem;
  margin: 0;
  padding: var(--course-space-md);
  max-height: calc(100vh - 3rem);
  overflow-y: auto;
}
.stepnav.side .stepnav-bar {
  display: none;
}
.stepnav.side .stepnav-head {
  display: block;
}
.stepnav.side .stepnav-list {
  display: block;
  padding: 0;
  border-top: 0;
}
.stepnav.side .stepnav-list li + li::before {
  content: "";
  position: absolute;
  left: 1.15rem;
  top: -0.55rem;
  height: 0.9rem;
  border-left: 1.5px solid var(--course-color-border);
}
.stepnav.side .stepnav-progress {
  margin-top: var(--course-space-md);
  border-radius: 4px;
}
/* keep wide figures and tables clear of the sidebar */
.has-stepnav-side .breakout {
  --bw: max(100%, min(64rem, calc(100vw - 2 * 14rem)));
  width: var(--bw);
  margin-inline: calc((100% - var(--bw)) / 2);
}

.step-panel > h2:first-child {
  margin-top: var(--course-space-lg);
}
.step-kicker {
  font: 600 0.75rem var(--course-font-ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--course-color-accent);
  margin: var(--course-space-lg) 0 0;
}
.step-kicker + h2 {
  margin-top: var(--course-space-xs);
  border-top: 0;
  padding-top: 0;
}
/* Steps flow on one page: a rule and some air between them. */
.step-panel + .step-panel {
  margin-top: var(--course-space-xl, 3rem);
  border-top: 1px solid var(--course-color-border);
}
.stepnav button:focus-visible,
.seg button:focus-visible,
.play:focus-visible {
  outline: 2px solid var(--course-color-focus);
  outline-offset: 2px;
}

/* ---------- Diagram card ---------- */
.viz {
  border: 1px solid var(--course-color-border);
  border-radius: 10px;
  background: var(--course-color-bg);
  padding: var(--course-space-md);
  margin: 0 0 var(--course-space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--course-space-md);
}
.viz-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--course-space-sm);
}
.viz-label {
  font: 600 0.75rem var(--course-font-ui);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--course-color-muted);
  margin: 0;
}
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  border: 1px solid var(--course-color-border);
  border-radius: 8px;
  overflow: hidden;
}
.seg button {
  font: 0.85rem var(--course-font-ui);
  color: var(--course-color-muted);
  background: transparent;
  border: 0;
  border-right: 1px solid var(--course-color-border);
  padding: 0.45rem 0.7rem;
  cursor: pointer;
}
.seg button:last-child {
  border-right: 0;
}
.seg button[aria-pressed="true"] {
  background: var(--viz-run-soft);
  color: var(--course-color-text);
  font-weight: 600;
}
.play {
  font: 600 0.85rem var(--course-font-ui);
  color: var(--course-color-accent-contrast);
  background: var(--course-color-accent);
  border: 0;
  border-radius: 8px;
  padding: 0.5rem 0.95rem;
  cursor: pointer;
}
.viz svg {
  display: block;
  width: 100%;
  max-width: 34rem;
  margin: 0 auto;
  height: auto;
  overflow: visible;
}
.viz-caption {
  font: 0.85rem/1.5 var(--course-font-ui);
  color: var(--course-color-muted);
  margin: 0;
}
.viz-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--course-space-md);
  font: 0.8rem var(--course-font-ui);
  color: var(--course-color-muted);
}
.viz-legend i {
  display: inline-block;
  width: 0.75rem;
  height: 0.75rem;
  border-radius: 3px;
  margin-right: 0.3rem;
  vertical-align: -1px;
}

/* Result chips and cards used inside diagrams */
.chip {
  display: inline-block;
  font: 700 0.75rem var(--course-font-ui);
  border-radius: 999px;
  padding: 0.1rem 0.5rem;
  white-space: nowrap;
}
.chip.ok {
  background: var(--viz-ok-soft);
  color: var(--viz-ok);
}
.chip.bad {
  background: var(--viz-bad-soft);
  color: var(--viz-bad);
}
.chip.warn {
  background: var(--viz-warn-soft);
  color: var(--viz-warn);
}
.chip.muted {
  background: var(--course-color-surface);
  color: var(--course-color-muted);
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
  gap: var(--course-space-sm);
}
.card {
  border: 1px solid var(--course-color-border);
  border-left-width: 4px;
  border-radius: 6px;
  padding: var(--course-space-sm) var(--course-space-md);
  font: 0.88rem/1.45 var(--course-font-ui);
  background: var(--course-color-bg);
  transition: border-color 0.2s;
}
.card.ok {
  border-left-color: var(--viz-ok);
}
.card.bad {
  border-left-color: var(--viz-bad);
}
.card h4 {
  font: 700 0.85rem var(--course-font-ui);
  margin: 0 0 0.2rem;
}
.card .sub {
  color: var(--course-color-muted);
  font-size: 0.78rem;
  margin: 0 0 0.35rem;
}
.card p {
  margin: 0.3rem 0 0;
}

/* ---------- Takeaway ---------- */
.remember {
  border-left: 4px solid var(--course-color-accent);
  padding: 0.2rem 0 0.2rem var(--course-space-md);
  margin: var(--course-space-lg) 0 var(--course-space-md);
}
.remember b {
  display: block;
  font: 700 0.75rem var(--course-font-ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--course-color-accent);
}

/* ---------- Go beside TypeScript ---------- */
.vs {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--course-space-md);
  margin-bottom: var(--course-space-lg);
}
@media (min-width: 48rem) {
  .vs {
    grid-template-columns: 1fr 1fr;
  }
}
.vs > div {
  min-width: 0;
}
.vs .code-block {
  margin: 0;
  height: calc(100% - 1.6rem);
}

/* ---------- Spot-it exercise: answer blurred until revealed ---------- */
.spot {
  border: 1px solid var(--course-color-border);
  border-left: 4px solid var(--course-color-accent);
  border-radius: var(--course-radius);
  padding: var(--course-space-md);
  margin: var(--course-space-lg) 0;
  background: var(--course-color-surface);
}
.spot-title {
  font: 700 0.85rem var(--course-font-ui);
  margin: 0 0 var(--course-space-sm);
}
.spot .code-block {
  margin: var(--course-space-sm) 0;
}
.spot-answer {
  margin-top: var(--course-space-sm);
  filter: blur(6px);
  user-select: none;
  transition: filter 0.2s ease;
}
.spot.revealed .spot-answer {
  filter: none;
  user-select: auto;
}
.spot-toggle {
  font: 600 0.85rem var(--course-font-ui);
  padding: 0.35rem 0.8rem;
  border: 1px solid var(--course-color-accent);
  border-radius: var(--course-radius);
  background: var(--course-color-bg);
  color: var(--course-color-accent);
  cursor: pointer;
}
.spot-toggle:focus-visible {
  outline: 3px solid var(--course-color-focus);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .spot-answer {
    transition: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .card,
  .stepnav-progress span {
    transition: none;
  }
}

 that holds up to Burst tokens and refills","newLine":9},{"kind":"add","text":"// at Rate tokens per second. A request spends one token.","newLine":10},{"kind":"add","text":"type Limiter struct {","newLine":11},{"kind":"add","text":"\trate  float64","newLine":12},{"kind":"add","text":"\tburst float64","newLine":13},{"kind":"add","text":"\tnow   func() time.Time // replaced in tests","newLine":14},{"kind":"add","text":"","newLine":15},{"kind":"add","text":"\tmu      sync.Mutex","newLine":16},{"kind":"add","text":"\tbuckets map[string]*bucket","newLine":17},{"kind":"add","text":"}","newLine":18},{"kind":"add","text":"","newLine":19},{"kind":"add","text":"type bucket struct {","newLine":20},{"kind":"add","text":"\ttokens float64","newLine":21},{"kind":"add","text":"\tlast   time.Time","newLine":22},{"kind":"add","text":"}","newLine":23},{"kind":"add","text":"","newLine":24},{"kind":"add","text":"func New(rate, burst float64) *Limiter {","newLine":25},{"kind":"add","text":"\treturn &Limiter{rate: rate, burst: burst, now: time.Now, buckets: map[string]*bucket{}}","newLine":26},{"kind":"add","text":"}","newLine":27},{"kind":"add","text":"","newLine":28},{"kind":"add","text":"// Allow reports whether key may make a request now. When it may not, it also","newLine":29},{"kind":"add","text":"// returns how long until the next token arrives.","newLine":30},{"kind":"add","text":"func (l *Limiter) Allow(key string) (bool, time.Duration) {","newLine":31},{"kind":"add","text":"\tl.mu.Lock()","newLine":32},{"kind":"add","text":"\tdefer l.mu.Unlock()","newLine":33},{"kind":"add","text":"","newLine":34},{"kind":"add","text":"\tnow := l.now()","newLine":35},{"kind":"add","text":"\tb, ok := l.buckets[key]","newLine":36},{"kind":"add","text":"\tif !ok {","newLine":37},{"kind":"add","text":"\t\tb = &bucket{tokens: l.burst, last: now}","newLine":38},{"kind":"add","text":"\t\tl.buckets[key] = b","newLine":39},{"kind":"add","text":"\t}","newLine":40},{"kind":"add","text":"\t// Refill lazily: no timer per client, just the time since the last call.","newLine":41},{"kind":"add","text":"\tb.tokens = min(l.burst, b.tokens+now.Sub(b.last).Seconds()*l.rate)","newLine":42},{"kind":"add","text":"\tb.last = now","newLine":43},{"kind":"add","text":"","newLine":44},{"kind":"add","text":"\tif b.tokens >= 1 {","newLine":45},{"kind":"add","text":"\t\tb.tokens--","newLine":46},{"kind":"add","text":"\t\treturn true, 0","newLine":47},{"kind":"add","text":"\t}","newLine":48},{"kind":"add","text":"\twait := time.Duration((1 - b.tokens) / l.rate * float64(time.Second))","newLine":49},{"kind":"add","text":"\treturn false, wait","newLine":50},{"kind":"add","text":"}","newLine":51}]}],"isTest":false,"repo":"notes"},{"path":"ratelimit/limiter_test.go","status":"added","additions":61,"deletions":0,"hunks":[{"oldStart":0,"oldLines":0,"newStart":1,"newLines":61,"lines":[{"kind":"add","text":"package ratelimit","newLine":1},{"kind":"add","text":"","newLine":2},{"kind":"add","text":"import (","newLine":3},{"kind":"add","text":"\t\"sync\"","newLine":4},{"kind":"add","text":"\t\"sync/atomic\"","newLine":5},{"kind":"add","text":"\t\"testing\"","newLine":6},{"kind":"add","text":"\t\"time\"","newLine":7},{"kind":"add","text":")","newLine":8},{"kind":"add","text":"","newLine":9},{"kind":"add","text":"func fixedClock(l *Limiter, t *time.Time) { l.now = func() time.Time { return *t } }","newLine":10},{"kind":"add","text":"","newLine":11},{"kind":"add","text":"func TestBurstThenRefill(t *testing.T) {","newLine":12},{"kind":"add","text":"\tclock := time.Unix(0, 0)","newLine":13},{"kind":"add","text":"\tl := New(2, 3) // 2 tokens per second, burst of 3","newLine":14},{"kind":"add","text":"\tfixedClock(l, &clock)","newLine":15},{"kind":"add","text":"","newLine":16},{"kind":"add","text":"\tfor i := 1; i \u003c= 3; i++ {","newLine":17},{"kind":"add","text":"\t\tif ok, _ := l.Allow(\"a\"); !ok {","newLine":18},{"kind":"add","text":"\t\t\tt.Fatalf(\"request %d: want allowed within the burst\", i)","newLine":19},{"kind":"add","text":"\t\t}","newLine":20},{"kind":"add","text":"\t}","newLine":21},{"kind":"add","text":"\tok, wait := l.Allow(\"a\")","newLine":22},{"kind":"add","text":"\tif ok || wait != 500*time.Millisecond {","newLine":23},{"kind":"add","text":"\t\tt.Fatalf(\"4th request: got (%v, %v), want (false, 500ms)\", ok, wait)","newLine":24},{"kind":"add","text":"\t}","newLine":25},{"kind":"add","text":"\tclock = clock.Add(500 * time.Millisecond)","newLine":26},{"kind":"add","text":"\tif ok, _ := l.Allow(\"a\"); !ok {","newLine":27},{"kind":"add","text":"\t\tt.Fatal(\"after 500ms: want one refilled token\")","newLine":28},{"kind":"add","text":"\t}","newLine":29},{"kind":"add","text":"}","newLine":30},{"kind":"add","text":"","newLine":31},{"kind":"add","text":"func TestKeysHaveTheirOwnBuckets(t *testing.T) {","newLine":32},{"kind":"add","text":"\tl := New(1, 1)","newLine":33},{"kind":"add","text":"\tl.Allow(\"a\")","newLine":34},{"kind":"add","text":"\tif ok, _ := l.Allow(\"b\"); !ok {","newLine":35},{"kind":"add","text":"\t\tt.Fatal(\"b must not share a's bucket\")","newLine":36},{"kind":"add","text":"\t}","newLine":37},{"kind":"add","text":"}","newLine":38},{"kind":"add","text":"","newLine":39},{"kind":"add","text":"// Run with -race: many goroutines must never spend more than the burst.","newLine":40},{"kind":"add","text":"func TestConcurrentCallersNeverOverspend(t *testing.T) {","newLine":41},{"kind":"add","text":"\tclock := time.Unix(0, 0)","newLine":42},{"kind":"add","text":"\tl := New(0.001, 50)","newLine":43},{"kind":"add","text":"\tfixedClock(l, &clock)","newLine":44},{"kind":"add","text":"","newLine":45},{"kind":"add","text":"\tvar allowed atomic.Int64","newLine":46},{"kind":"add","text":"\tvar wg sync.WaitGroup","newLine":47},{"kind":"add","text":"\tfor i := 0; i \u003c 200; i++ {","newLine":48},{"kind":"add","text":"\t\twg.Add(1)","newLine":49},{"kind":"add","text":"\t\tgo func() {","newLine":50},{"kind":"add","text":"\t\t\tdefer wg.Done()","newLine":51},{"kind":"add","text":"\t\t\tif ok, _ := l.Allow(\"shared\"); ok {","newLine":52},{"kind":"add","text":"\t\t\t\tallowed.Add(1)","newLine":53},{"kind":"add","text":"\t\t\t}","newLine":54},{"kind":"add","text":"\t\t}()","newLine":55},{"kind":"add","text":"\t}","newLine":56},{"kind":"add","text":"\twg.Wait()","newLine":57},{"kind":"add","text":"\tif got := allowed.Load(); got != 50 {","newLine":58},{"kind":"add","text":"\t\tt.Fatalf(\"allowed %d requests, want exactly the burst of 50\", got)","newLine":59},{"kind":"add","text":"\t}","newLine":60},{"kind":"add","text":"}","newLine":61}]}],"isTest":true,"repo":"notes"}]},"walkthrough":{"title":"Per-client rate limiting for the notes API","changeId":"demo-notes-rate-limit","overview":{"title":"Every client gets a token bucket, checked before any handler runs","explanation":"The notes API had no protection against a client hammering it. This change wraps the whole mux in a `rateLimit` middleware. Each client IP owns a **token bucket**: it starts full (the *burst*), refills at a steady *rate*, and every request spends one token. An empty bucket means `429 Too Many Requests` with a `Retry-After` header.\n\nThree pieces connect: `config.go` reads `RATE_LIMIT` and `RATE_BURST` and refuses bad values, `main.go` builds one `Limiter` and wraps the mux, and `ratelimit/limiter.go` does the arithmetic under a mutex. The tests pin the arithmetic with a fake clock and prove concurrent callers can't overspend.\n\nThe limiter is deliberately small: in-memory, per process, keyed by the TCP peer address. That is the right first step for a single instance, and the README says plainly where it stops working.","diagrams":[{"html":"\u003cfigure class=\"viz\">\n\u003cdiv class=\"viz-top\">\n\u003cdiv class=\"seg\" role=\"group\" aria-label=\"Client's budget\">\u003cbutton data-v=\"under\" aria-pressed=\"true\">Under the limit\u003c/button>\u003cbutton data-v=\"over\" aria-pressed=\"false\">Over the limit\u003c/button>\u003c/div>\n\u003cbutton class=\"play\" type=\"button\">▶ Play\u003c/button>\n\u003c/div>\n\u003csvg viewBox=\"0 0 600 200\" role=\"img\" aria-label=\"A request goes from the client to the rateLimit middleware, then to the notes handler. Over the limit, the middleware answers 429 and the handler never runs.\">\n\u003cdefs>\u003cmarker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#4d4d4d\"/>\u003c/marker>\n\u003cmarker id=\"arr-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#a8322b\"/>\u003c/marker>\n\u003cmarker id=\"arr-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#2d6a4f\"/>\u003c/marker>\u003c/defs>\n\u003cg font-size=\"15\" text-anchor=\"middle\">\n\u003crect x=\"10\" y=\"40\" width=\"120\" height=\"56\" rx=\"8\" fill=\"#f4f4f2\" stroke=\"#cfcfc9\"/>\u003ctext x=\"70\" y=\"73\">Client\u003c/text>\n\u003crect id=\"mw\" x=\"230\" y=\"40\" width=\"140\" height=\"56\" rx=\"8\" fill=\"#e9f0f2\" stroke=\"#0f4c5c\"/>\u003ctext x=\"300\" y=\"66\">rateLimit\u003c/text>\u003ctext x=\"300\" y=\"86\" font-size=\"12\" fill=\"#4d4d4d\">Allow(ip)\u003c/text>\n\u003cg id=\"handler\">\u003crect x=\"470\" y=\"40\" width=\"120\" height=\"56\" rx=\"8\" fill=\"#f4f4f2\" stroke=\"#cfcfc9\"/>\u003ctext x=\"530\" y=\"66\">mux\u003c/text>\u003ctext x=\"530\" y=\"86\" font-size=\"12\" fill=\"#4d4d4d\">GET/POST /notes\u003c/text>\u003c/g>\n\u003c/g>\n\u003cline x1=\"130\" y1=\"58\" x2=\"226\" y2=\"58\" stroke=\"#4d4d4d\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n\u003cline id=\"toHandler\" x1=\"370\" y1=\"58\" x2=\"466\" y2=\"58\" stroke=\"#4d4d4d\" stroke-width=\"2\" marker-end=\"url(#arr)\"/>\n\u003cpath id=\"back\" d=\"M530,96 V150 H70 V100\" fill=\"none\" stroke=\"#2d6a4f\" stroke-width=\"2\" marker-end=\"url(#arr-ok)\"/>\n\u003ctext id=\"backLabel\" x=\"300\" y=\"170\" text-anchor=\"middle\" font-size=\"14\" fill=\"#2d6a4f\">200 / 201 from the handler\u003c/text>\n\u003ccircle id=\"dot\" r=\"7\" fill=\"#0f4c5c\" cx=\"70\" cy=\"58\" opacity=\"0\"/>\n\u003c/svg>\n\u003cdiv class=\"cards\" aria-live=\"polite\">\u003c/div>\n\u003c/figure>","script":"(function(){\n  var state = \"under\";\n  var $ = function(id){ return document.getElementById(id); };\n  var cards = document.querySelector(\".cards\");\n  var text = {\n    under: [\"ok\", \"Allowed\", \"Allow spends one token and the request reaches the mux. The client sees the normal response.\"],\n    over: [\"bad\", \"429 Too Many Requests\", \"The bucket is empty. The middleware writes Retry-After and returns; the handler never runs and the store is never locked.\"]\n  };\n  function draw(){\n    var over = state === \"over\";\n    $(\"handler\").setAttribute(\"opacity\", over ? \"0.35\" : \"1\");\n    $(\"toHandler\").setAttribute(\"opacity\", over ? \"0.2\" : \"1\");\n    var back = $(\"back\");\n    back.setAttribute(\"d\", over ? \"M300,96 V150 H70 V100\" : \"M530,96 V150 H70 V100\");\n    back.setAttribute(\"stroke\", over ? \"#a8322b\" : \"#2d6a4f\");\n    back.setAttribute(\"marker-end\", over ? \"url(#arr-bad)\" : \"url(#arr-ok)\");\n    var label = $(\"backLabel\");\n    label.textContent = over ? \"429 · Retry-After: 1\" : \"200 / 201 from the handler\";\n    label.setAttribute(\"fill\", over ? \"#a8322b\" : \"#2d6a4f\");\n    label.setAttribute(\"x\", over ? \"185\" : \"300\");\n    var t = text[state];\n    cards.innerHTML = \"\";\n    var c = document.createElement(\"div\"); c.className = \"card \" + t[0];\n    var h = document.createElement(\"h4\"); h.textContent = t[1];\n    var p = document.createElement(\"p\"); p.textContent = t[2];\n    c.appendChild(h); c.appendChild(p); cards.appendChild(c);\n  }\n  Viz.seg(document.querySelector(\".seg\"), function(v){ state = v; draw(); });\n  document.querySelector(\".play\").addEventListener(\"click\", function(){\n    if (Viz.reduced) return;\n    var dot = $(\"dot\");\n    var pts = state === \"over\" ? [[70,58],[300,58],[300,150],[70,150],[70,100]] : [[70,58],[300,58],[530,58],[530,150],[70,150],[70,100]];\n    var i = 0, f = 0; dot.setAttribute(\"opacity\", \"1\");\n    function frame(){\n      var a = pts[i], b = pts[i+1];\n      if (!b) { dot.setAttribute(\"opacity\", \"0\"); return; }\n      f += 0.06;\n      if (f >= 1) { f = 0; i++; return requestAnimationFrame(frame); }\n      dot.setAttribute(\"cx\", a[0] + (b[0]-a[0])*f); dot.setAttribute(\"cy\", a[1] + (b[1]-a[1])*f);\n      requestAnimationFrame(frame);\n    }\n    frame();\n  });\n  draw();\n})();","caption":"Over the limit, the request stops at the middleware: the handler and the store's mutex are never touched."}],"decisions":[{"title":"In-memory buckets, per process","choice":"Buckets live in a map inside the Go process.","alternatives":"A shared store such as Redis, so every replica counts against one budget.","tradeoff":"Two replicas allow twice the rate, and a restart forgets every bucket. Fine for one instance; revisit before scaling out."},{"title":"Lazy refill instead of a ticker","choice":"Allow() adds rate × elapsed tokens when it runs; nothing runs between requests.","alternatives":"A goroutine that tops up every bucket on a timer.","tradeoff":"No background work and exact arithmetic. But buckets are never deleted, so memory grows with every distinct IP."},{"title":"Key by RemoteAddr","choice":"The client key is the TCP peer's IP.","alternatives":"X-Forwarded-For, which is only safe when a trusted proxy sets it.","tradeoff":"Behind a proxy every caller shares one bucket. Trusting the header without a proxy lets clients pick their own key."}],"remember":"A token bucket allows short bursts but caps the average: burst is how many at once, rate is how fast it refills.","quiz":[{"prompt":"With RATE_LIMIT=5 and RATE_BURST=10, a quiet client sends 12 requests at once. What happens?","options":["All 12 succeed","10 succeed, 2 get 429 with Retry-After: 1","5 succeed, 7 get 429","The first request gets 429"],"correct":1,"answer":"The bucket starts full at 10 tokens and nothing refills between simultaneous requests. The next token is 200 ms away, which rounds up to Retry-After: 1."},{"prompt":"The service runs as three replicas behind a round-robin load balancer. Roughly how fast can one client go?","options":["5 requests/s","15 requests/s","Unlimited","1.7 requests/s"],"correct":1,"answer":"Each process keeps its own buckets, so the client gets a full budget on every replica."},{"prompt":"Why does Allow() take a mutex when Node code doing the same Map update wouldn't need a lock?","options":["Go maps are slower","net/http serves each request on its own goroutine, so Allow() runs in parallel","The mutex makes the limiter fair","time.Now is not thread-safe"],"correct":1,"answer":"Concurrent map writes in Go are a data race (and can crash the program). TestConcurrentCallersNeverOverspend runs 200 goroutines under -race to prove the lock holds."},{"prompt":"What would a senior reviewer flag first before this ships to the public internet?","options":["The 429 status code","Buckets are never evicted, so memory grows with every distinct IP","Using float64 for tokens","The README table"],"correct":1,"answer":"An attacker rotating source addresses creates a bucket per address. An idle-bucket sweep (or an LRU cap) is the usual fix."}]},"files":[{"path":"main.go","role":"Entry: wrap the whole mux once","explanation":"`main` now gets its settings from `loadConfig` and exits if they're invalid, rather than starting with a silent default ([fail fast](#config)).\n\nIt builds **one** limiter and wraps the entire mux ([the wrap](#wrap)). Every route, present and future, is limited by default. That is the safe default for a small API. The cost is that health checks or internal callers would be limited too; a reviewer may ask for an allowlist later.","anchors":[{"id":"config","startLine":11,"endLine":14,"note":"Exit on bad config"},{"id":"wrap","startLine":20,"endLine":22,"note":"One limiter around the mux"}],"remember":"Middleware that wraps the mux applies to every route, including ones added later.","tour":[{"lines":{"start":3,"end":8},"title":"Imports follow the wiring","text":"`os` is gone because `main` no longer reads the environment itself; `config.go` owns that now. The new import is the `ratelimit` package, which keeps the limiter testable on its own with no HTTP in sight."},{"lines":{"start":10,"end":14},"title":"Configuration before anything listens","text":"`loadConfig` runs first and `log.Fatal` exits on an error, so a bad `RATE_LIMIT` stops the deploy at startup instead of serving traffic with a surprise limit. The old inline `ADDR` default moved into `loadConfig`, so every setting has one home."},{"lines":{"start":20,"end":22},"title":"One limiter around the whole mux","text":"A single `Limiter` is shared by every request, which is what makes the budget per client rather than per connection. Wrapping the mux, not individual routes, means a route added later is limited automatically. The cost: health checks are limited too, and there is no allowlist. The startup log prints the effective limits, which is the first thing you check when a client reports 429s."}]},{"path":"config.go","role":"Settings: refuse values that would disable the limit","explanation":"`loadConfig` starts from defaults (5 req/s, burst 10) and overrides them from the environment ([env loop](#env)). A value that doesn't parse, or isn't positive, is an **error**, not a fallback. If `RATE_LIMIT=five` quietly fell back to \"no limit\", nobody would notice until the outage.\n\nA burst below 1 is rejected separately ([burst check](#burst)): with `RATE_BURST=0.5` the bucket could never hold a whole token, and every request would get 429.","anchors":[{"id":"env","startLine":22,"endLine":32,"note":"Parse and validate each variable"},{"id":"burst","startLine":33,"endLine":35,"note":"Burst must hold at least one token"}],"notes":[{"title":"A map of pointers to fill a struct","body":"The loop ranges over name → *float64 and writes through the pointer, so one loop sets two struct fields. TypeScript objects are always references, so the same trick needs no special syntax there.","code":"for name, dst := range map[string]*float64{\"RATE_LIMIT\": &c.RateLimit} {\n\t*dst = parse(os.Getenv(name))\n}","lang":"Go","vs":"const c = { rateLimit: 5 };\nconst targets = { RATE_LIMIT: \"rateLimit\" } as const;\nfor (const [name, key] of Object.entries(targets)) {\n  c[key] = parse(process.env[name]);\n}","vsLang":"TypeScript","lines":{"startLine":22,"endLine":31}}],"tour":[{"lines":{"start":9,"end":13},"title":"Settings as a typed struct","text":"Rate and burst are `float64` because the bucket does fractional arithmetic (tokens refill continuously). Keeping them in one struct means `main` passes typed values, never raw strings, to the limiter."},{"lines":{"start":17,"end":21},"title":"Defaults, then the environment","text":"Defaults are written once, in the literal. Each variable only overrides when it's set, so an unset `ADDR` keeps `:8080` and a deploy with no new variables behaves sensibly."},{"lines":{"start":22,"end":32},"title":"Parse strictly, reject non-positive values","text":"The loop writes through a pointer into the struct, so both numeric settings share one parse-and-validate path. A value that doesn't parse, or is zero or negative, returns an error naming the variable and the bad value. A zero rate would make `Allow` divide by zero when computing the wait (an infinite float, then a nonsense `Duration`), so this check protects the limiter as well as the operator."},{"lines":{"start":33,"end":36},"title":"Burst must hold one whole token","text":"A burst of 0.5 parses fine but would make every request fail: the bucket could never reach the 1 token a request costs. This is a cross-field rule the loop can't express, so it gets its own check after parsing."}]},{"path":"middleware.go","role":"The gate: answer 429 before any handler runs","explanation":"`rateLimit` is a standard `http.Handler` wrapper. It asks the limiter about this client, and either passes the request on or writes the rejection itself ([the gate](#gate)). `Retry-After` must be whole seconds, so the wait is rounded **up**: 200 ms becomes 1. Rounding down would tell clients to retry immediately, into another 429.\n\nThe key is the peer IP ([client key](#key)). That is correct when clients connect directly. Behind a load balancer every request shares the balancer's IP, so all users would share one bucket. The fix is to read `X-Forwarded-For`, but only from a proxy you trust, since clients can set the header to anything.","anchors":[{"id":"gate","startLine":16,"endLine":22,"note":"Allow, or 429 with Retry-After"},{"id":"key","startLine":28,"endLine":34,"note":"The client is its TCP peer IP"}],"notes":[{"title":"Go middleware is a function that wraps a Handler","body":"An http.Handler is anything with ServeHTTP. Middleware takes the next handler and returns a new one; not calling next.ServeHTTP is how it stops the chain. Express does the same with next().","code":"func rateLimit(l *Limiter, next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tif ok, _ := l.Allow(key(r)); !ok {\n\t\t\thttp.Error(w, \"slow down\", 429)\n\t\t\treturn\n\t\t}\n\t\tnext.ServeHTTP(w, r)\n\t})\n}","lang":"Go","vs":"function rateLimit(l: Limiter): RequestHandler {\n  return (req, res, next) => {\n    if (!l.allow(key(req))) {\n      res.status(429).send(\"slow down\");\n      return;\n    }\n    next();\n  };\n}","vsLang":"TypeScript","lines":{"startLine":14,"endLine":24}}],"tour":[{"lines":{"start":14,"end":16},"title":"Wrap the next handler and ask the limiter","text":"`rateLimit` returns a new handler that closes over the limiter and the wrapped mux. Every request calls `Allow` exactly once, keyed by client IP, before any route matching. That ordering means rejected requests cost almost nothing: no body is read and no store lock is taken."},{"lines":{"start":17,"end":21},"title":"Reject: Retry-After, 429, stop","text":"The header must be set before `http.Error` writes the status, because headers can't change once the body starts. The wait is rounded **up** to whole seconds, as `Retry-After` requires; rounding down would invite an immediate retry that fails again. The `return` is what stops the chain: forget it and the request is both rejected and served."},{"lines":{"start":22,"end":24},"title":"Allow: pass the request on unchanged","text":"On success the middleware is invisible: same writer, same request. Nothing is recorded after the handler runs, so slow handlers don't affect the budget; it counts requests, not time or bytes."},{"lines":{"start":28,"end":34},"title":"Who is the client?","text":"The key is the TCP peer's IP from `RemoteAddr`, with the port stripped so each new connection from one machine shares a bucket. If parsing fails, the raw address is used rather than rejecting the request. Behind a proxy this is the proxy's IP for everyone, the biggest operational caveat in the change."}]},{"path":"ratelimit/limiter.go","role":"The bucket: lazy refill under one mutex","explanation":"Each key gets a bucket with a token count and the time it was last touched. A new key starts **full** ([new bucket](#new)); refill is lazy ([refill](#refill)), so there are no timers, just arithmetic on elapsed time whenever the key is seen. Then it spends a token or says how long until one arrives ([spend](#spend)).\n\nOne mutex guards every key, because `net/http` calls `Allow` from many goroutines at once. Simple and fast enough for a small service; under heavy contention you would shard the map.","anchors":[{"id":"new","startLine":36,"endLine":40,"note":"First request: a full bucket"},{"id":"refill","startLine":41,"endLine":43,"note":"Refill by elapsed time, capped at burst"},{"id":"spend","startLine":45,"endLine":50,"note":"Spend a token, or say how long to wait"}],"diagram":{"html":"\u003cfigure class=\"viz\">\n\u003cdiv class=\"viz-top\">\n\u003cp class=\"viz-label\">12 requests arrive at once · rate 5/s\u003c/p>\n\u003cdiv class=\"seg\" role=\"group\" aria-label=\"Burst size\">\u003cbutton data-v=\"10\" aria-pressed=\"true\">Burst 10\u003c/button>\u003cbutton data-v=\"3\" aria-pressed=\"false\">Burst 3\u003c/button>\u003c/div>\n\u003cbutton class=\"play\" type=\"button\">▶ Play\u003c/button>\n\u003c/div>\n\u003csvg viewBox=\"0 0 600 190\" role=\"img\" aria-label=\"A bucket of tokens and twelve requests. Each request spends one token; requests after the bucket empties get 429.\">\n\u003cg font-size=\"14\">\n\u003ctext x=\"20\" y=\"24\" fill=\"#4d4d4d\">Bucket\u003c/text>\n\u003crect x=\"20\" y=\"34\" width=\"70\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#0f4c5c\" stroke-width=\"2\"/>\n\u003crect id=\"level\" x=\"22\" y=\"36\" width=\"66\" height=\"136\" rx=\"4\" fill=\"#e9f0f2\"/>\n\u003ctext id=\"tokens\" x=\"55\" y=\"110\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"600\" fill=\"#0f4c5c\">\u003c/text>\n\u003ctext x=\"120\" y=\"24\" fill=\"#4d4d4d\">Requests, in arrival order\u003c/text>\n\u003cg id=\"reqs\">\u003c/g>\n\u003c/g>\n\u003c/svg>\n\u003cdiv class=\"cards\" aria-live=\"polite\">\u003c/div>\n\u003c/figure>","script":"(function(){\n  var NS = \"http://www.w3.org/2000/svg\";\n  var RATE = 5, N = 12, burst = 10, shown = N, timer;\n  function el(tag, attrs, parent, text){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; }\n  // The same arithmetic as Allow(): all requests at t=0, so no refill between them.\n  function simulate(b){\n    var tokens = b, out = [];\n    for (var i = 0; i \u003c N; i++) {\n      if (tokens >= 1) { tokens -= 1; out.push({ ok: true, left: tokens }); }\n      else out.push({ ok: false, left: tokens, wait: Math.ceil((1 - tokens) / RATE) });\n    }\n    return out;\n  }\n  function draw(){\n    var res = simulate(burst), g = document.getElementById(\"reqs\");\n    g.innerHTML = \"\";\n    var left = burst;\n    for (var i = 0; i \u003c N; i++) {\n      var r = res[i], x = 120 + (i % 6) * 78, y = 36 + Math.floor(i / 6) * 72;\n      var visible = i \u003c shown;\n      if (visible) left = r.left;\n      el(\"rect\", { x: x, y: y, width: 68, height: 58, rx: 6, fill: !visible ? \"#f4f4f2\" : r.ok ? \"#e3f1e8\" : \"#f8e1de\", stroke: !visible ? \"#cfcfc9\" : r.ok ? \"#2d6a4f\" : \"#a8322b\" }, g);\n      el(\"text\", { x: x + 34, y: y + 24, \"text-anchor\": \"middle\", fill: \"#1a1a1a\" }, g, \"#\" + (i + 1));\n      el(\"text\", { x: x + 34, y: y + 45, \"text-anchor\": \"middle\", \"font-size\": 13, fill: !visible ? \"#4d4d4d\" : r.ok ? \"#2d6a4f\" : \"#a8322b\" }, g, !visible ? \"…\" : r.ok ? \"allowed\" : \"429\");\n    }\n    var h = 136 * (left / burst);\n    var level = document.getElementById(\"level\");\n    level.setAttribute(\"height\", String(Math.max(0, h)));\n    level.setAttribute(\"y\", String(36 + 136 - Math.max(0, h)));\n    document.getElementById(\"tokens\").textContent = left.toFixed(0) + \" / \" + burst;\n    var allowed = res.filter(function(r){ return r.ok; }).length;\n    var cards = document.querySelector(\".cards\");\n    cards.innerHTML = \"\";\n    [[\"ok\", allowed + \" allowed\", \"A quiet client may send up to the burst at once.\"],\n     [\"bad\", (N - allowed) + \" rejected\", \"Each gets 429 with Retry-After: 1. The next token arrives in 1/5 s = 200 ms, rounded up to whole seconds.\"]].forEach(function(c){\n      var d = document.createElement(\"div\"); d.className = \"card \" + c[0];\n      var h4 = document.createElement(\"h4\"); h4.textContent = c[1];\n      var p = document.createElement(\"p\"); p.textContent = c[2];\n      d.appendChild(h4); d.appendChild(p); cards.appendChild(d);\n    });\n  }\n  Viz.seg(document.querySelector(\".seg\"), function(v){ burst = Number(v); shown = N; clearInterval(timer); draw(); });\n  document.querySelector(\".play\").addEventListener(\"click\", function(){\n    clearInterval(timer);\n    if (Viz.reduced) { shown = N; return draw(); }\n    shown = 0; draw();\n    timer = setInterval(function(){ shown++; draw(); if (shown >= N) clearInterval(timer); }, 260);\n  });\n  draw();\n})();","caption":"Same arithmetic as Allow(). Change only the burst and watch how many of the 12 get through."},"remember":"Lazy refill means no timers: the bucket is brought up to date only when its key is used.","notes":[{"title":"Why Go needs the mutex and Node wouldn't","body":"Go serves requests on many goroutines in parallel, so two Allow calls can update the map at the same moment: a data race. Node runs your JavaScript on one thread, so a synchronous Map update can't interleave with another.","code":"l.mu.Lock()\ndefer l.mu.Unlock() // runs when Allow returns\nb := l.buckets[key]\nb.tokens--","lang":"Go","vs":"// No lock: nothing else runs until this\n// synchronous function returns.\nconst b = buckets.get(key)!;\nb.tokens--;","vsLang":"TypeScript","lines":{"startLine":31,"endLine":33}},{"title":"Returning two values","body":"Go functions can return several values; callers destructure them like a TypeScript tuple. Here the second value is the wait, meaningful only when the first is false.","code":"ok, wait := l.Allow(ip)","lang":"Go","vs":"const [ok, wait] = limiter.allow(ip);","vsLang":"TypeScript","lines":{"startLine":31,"endLine":31}}],"tour":[{"lines":{"start":11,"end":18},"title":"State: settings, a clock seam, and a guarded map","text":"`now` is a function field so tests can freeze time. `mu` guards `buckets`, and the fields above it are never written after `New`, so they're safe to read without the lock. Unexported fields mean callers can't change the rate under a running limiter."},{"lines":{"start":20,"end":27},"title":"A bucket is two numbers","text":"Each client costs one small struct: tokens left and when they were last updated. That is all lazy refill needs. The map is never pruned, so memory grows with every distinct key; an idle-bucket sweep is the obvious follow-up."},{"lines":{"start":31,"end":33},"title":"Hold the lock for the whole decision","text":"Read, refill, spend and write happen under one lock. Locking only the map read would let two goroutines both see one token and both spend it, which is exactly the overspend the concurrency test checks. `defer` releases the lock on every return path."},{"lines":{"start":35,"end":40},"title":"First sight: a full bucket","text":"A new key starts with `burst` tokens, so a quiet client can send a burst immediately. The alternative, starting empty, would reject a client's very first request."},{"lines":{"start":41,"end":43},"title":"Refill by elapsed time, capped","text":"Tokens grow by `elapsed × rate` since this key was last seen, capped at the burst so a long-idle client can't bank unlimited requests. Elapsed time uses Go's monotonic clock reading, so a wall-clock change can't refill or drain buckets. Updating `last` here, even on rejection, is what makes the next refill correct."},{"lines":{"start":45,"end":50},"title":"Spend, or say how long to wait","text":"With at least one token, spend it and allow. Otherwise the wait is the missing fraction of a token divided by the rate: with 0 tokens at 5/s that is 200 ms. A rejection spends nothing, so a client that retries too early is never pushed further into debt."}]},{"path":"ratelimit/limiter_test.go","role":"Proof: the arithmetic and the lock","explanation":"A fake clock pins the burst-then-refill arithmetic (the 4th request waits exactly 500 ms at 2 tokens/s), keys are shown to be independent, and 200 goroutines sharing one key must get exactly the burst of 50. Run it with `-race` to make the last test meaningful."},{"path":"middleware_test.go","role":"Proof: the HTTP contract","explanation":"With rate 1 and burst 1, the second request gets 429 and `Retry-After: 1`. This pins the status and the rounding, the two things clients depend on."},{"path":"README.md","role":"Docs: configuration and the limits of the limiter","explanation":"Documents the two new variables and states the honest limits: per process, forgotten on restart, and wrong behind a proxy until the key is fixed."}]},"profile":{"knows":["TypeScript","React Native"],"learning":["Go"]}}</script>
